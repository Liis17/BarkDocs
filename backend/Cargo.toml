[workspace]
resolver = "3"
members = [
    "barkdocs-admin",
    "barkdocs-auth",
    "barkdocs-engine",
    "barkdocs-web",
]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
axum = "0.8"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
htmd = "0.5"
maud = { version = "0.27", features = ["axum"] }
reqwest = { version = "0.13", default-features = false }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tar = "0.4"
texting_robots = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
